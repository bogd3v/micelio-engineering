name: Verify draft

# Gate 4 of the `normal` lane (docs/factory.md, ADR-0003) repeated by CI on a pull request, on the
# pull request's head, not on its merge with the base branch (check.yml builds and tests the merge): when the
# diff fits the `normal` lane, runs `verify-draft` on the pull request's description, so a number the
# code does not produce turns the check red. The tools are built from the commit this workflow is
# pinned at (job.workflow_sha); tools-ref and tools-repository are accepted, ignored and warned about
# when they differ, until they go with #30. Call it from a workflow that runs on pull_request:
#
#   on:
#     pull_request:
#   jobs:
#     verify-draft:
#       permissions:
#         contents: read
#         pull-requests: read
#       uses: bogd3v/micelio-engineering/.github/workflows/verify-draft.yml@<commit SHA> # <tag>
#       with:
#         reuse: true # optional: install reuse 6.2.0 for the draft's commands
#         cargo-deny: true # optional: install cargo-deny 0.21.0 for the draft's commands
#
# It takes no secrets. The description is untrusted text: it reaches `verify-draft` through a file
# that a step writes from an environment variable, never a shell line or an expression of a `run:`
# script. `verify-draft` runs only the repository's own commands (the `## Commands` block of AGENTS.md
# and the scripts of package.json) and the job never builds or starts a stack.

on:
  workflow_call:
    inputs:
      tools-ref:
        description: Ignored; the tools are built from the commit this workflow is pinned at (job.workflow_sha). A value that differs prints a warning. Goes with #30
        type: string
        required: false
        default: ''
      tools-repository:
        description: Ignored; the tools come from the repository of this workflow (job.workflow_repository). A value that differs prints a warning. Goes with #30
        type: string
        default: bogd3v/micelio-engineering
      reuse:
        description: Install reuse 6.2.0 for the draft's commands
        type: boolean
        default: false
      cargo-deny:
        description: Install cargo-deny 0.21.0 for the draft's commands
        type: boolean
        default: false

permissions: {}

jobs:
  verify-draft:
    name: Verify draft
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Warn when tools-ref or tools-repository differs from the workflow
        env:
          TOOLS_REF: ${{ inputs.tools-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          TOOLS_REPOSITORY: ${{ inputs.tools-repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          if [ -n "$TOOLS_REF" ] && [ "$TOOLS_REF" != "$WORKFLOW_SHA" ]; then
            echo "::warning::tools-ref ($TOOLS_REF) differs from the workflow's commit ($WORKFLOW_SHA): it is ignored and the tools are built from $WORKFLOW_SHA"
          fi
          if [ -n "$TOOLS_REPOSITORY" ] && [ "$TOOLS_REPOSITORY" != "$WORKFLOW_REPOSITORY" ]; then
            echo "::warning::tools-repository ($TOOLS_REPOSITORY) differs from the workflow's repository ($WORKFLOW_REPOSITORY): it is ignored and the tools are built from $WORKFLOW_REPOSITORY"
          fi

      - name: Checkout the tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .micelio-tools
          persist-credentials: false

      - name: Set up Node for the tools
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .micelio-tools/.nvmrc
          cache: npm
          cache-dependency-path: .micelio-tools/package-lock.json

      - name: Build the tools
        working-directory: .micelio-tools
        run: |
          npm ci --ignore-scripts
          npm run build

      # The checkout must be inside the workspace, but the commands verify-draft runs (prettier --check .,
      # lint) read the whole workspace, and lint-lane lists untracked files: move the built tools out.
      - name: Move the tools out of the workspace
        run: |
          mv .micelio-tools "$RUNNER_TEMP/tools"

      # The diff is the head's against its merge base with the base branch: against a base that moved
      # on, it would list main's new files as the pull request's. A failing merge-base fails the job.
      # Exit 0: the diff fits the normal lane. Exit 1: it does not (or the repository has no
      # `## Lanes` block, so it is `full`): gate 4 is the verifier and the job passes. Exit 2 fails.
      - name: Check the lane
        id: lane
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! MERGE_BASE=$(git merge-base HEAD "$BASE_SHA") || [ -z "$MERGE_BASE" ]; then
            echo "::error::git merge-base failed for HEAD and $BASE_SHA"
            exit 1
          fi
          code=0
          node "$RUNNER_TEMP/tools/packages/factory-tools/dist/cli.js" lint-lane --diff "$MERGE_BASE" --lane normal || code=$?
          if [ "$code" -eq 1 ]; then
            echo "full lane: gate 4 is the verifier"
          elif [ "$code" -ne 0 ]; then
            echo "::error::lint-lane failed (exit $code)"
            exit 1
          fi
          echo "normal=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: ${{ steps.lane.outputs.normal == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # The install: line of the first Commands block of AGENTS.md, then reuse when the caller asks
      # (a command such as `npm run verify:template` ends with `reuse lint`; ubuntu-latest has no reuse).
      - name: Install dependencies
        if: ${{ steps.lane.outputs.normal == 'true' }}
        env:
          INSTALL_REUSE: ${{ inputs.reuse }}
        run: |
          INSTALL=$(awk '/^## Commands/ { seen = 1; next } seen && /^```/ { if (inside) exit; inside = 1; next } inside && /^install:/ { sub(/^install:[ \t]*/, ""); sub(/[ \t]+#.*$/, ""); print; exit }' AGENTS.md)
          if [ -z "$INSTALL" ]; then
            echo "::error::AGENTS.md has no install: line in its first Commands block"
            exit 1
          fi
          bash -e -c "$INSTALL"
          if [ "$INSTALL_REUSE" = "true" ]; then
            pipx install reuse==6.2.0
          fi

      # A command such as `npm run verify:template -- --profile rust` calls cargo-deny, which
      # ubuntu-latest does not have. The version is the one check.yml installs; the release's static
      # binary is installed instead of building it, and only after its SHA-256, written here and never
      # fetched, matches: a changed release asset fails the step.
      - name: Install cargo-deny
        if: ${{ inputs.cargo-deny && steps.lane.outputs.normal == 'true' }}
        run: |
          VERSION=0.21.0
          SHA256=a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903
          NAME="cargo-deny-$VERSION-x86_64-unknown-linux-musl"
          ARCHIVE="$RUNNER_TEMP/$NAME.tar.gz"
          curl -fsSL --retry 3 -o "$ARCHIVE" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$NAME.tar.gz"
          echo "$SHA256  $ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" "$NAME/cargo-deny"
          BIN="$RUNNER_TEMP/cargo-deny-bin"
          mkdir -p "$BIN"
          mv "$RUNNER_TEMP/$NAME/cargo-deny" "$BIN/cargo-deny"
          echo "$BIN" >> "$GITHUB_PATH"
          PATH="$BIN:$PATH" cargo-deny --version

      # The description is data: it is written to a file from the environment and read by the tool.
      - name: Verify the draft
        if: ${{ steps.lane.outputs.normal == 'true' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/draft.md"
          node "$RUNNER_TEMP/tools/packages/factory-tools/dist/cli.js" verify-draft --draft "$RUNNER_TEMP/draft.md" --cwd .
