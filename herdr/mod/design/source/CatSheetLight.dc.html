<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent cats sheet, light theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--cyan)}a:hover{color:var(--magenta)}
</style>
</helmet>
<div style="width: 1100px; min-height: 1320px">
  <dc-import name="CatSheet" theme="light" hint-size="1100px,1320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":1320}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
