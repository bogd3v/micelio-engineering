name: Bot check

# One-off smoke test of the Micelio bot GitHub App: mints a token from the
# organisation's app id and private key, lists the repositories the
# installation reaches and leaves the proof as a comment on issue #5.
# Removed once the standard-sync workflow (#5) replaces it.

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a token for Micelio bot
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MICELIO_BOT_APP_ID }}
          private-key: ${{ secrets.MICELIO_BOT_PRIVATE_KEY }}
          owner: bogd3v

      - name: List the repositories the installation reaches
        id: repos
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          list=$(gh api installation/repositories --jq '[.repositories[].full_name] | join(", ")')
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Leave the proof on issue 5
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          LIST: ${{ steps.repos.outputs.list }}
        run: |
          gh issue comment 5 --repo bogd3v/micelio-engineering \
            --body "Bot check passed. Installation reaches: ${LIST}"
