name: CI

# Runs the reusable workflows and the actions of this repository on itself, so a change to one is
# tried before a repository calls it (the local `uses: ./` is replaced by the repository and a commit
# SHA there).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  issues:
    types: [opened, edited, milestoned]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'issues' }}
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      # lint:licenses, lint:standard and reuse lint run.
      licenses: true
      standard: true
      reuse: true

  # The rust profile on a minimal Rust library; the root job above is the typescript profile.
  check-rust:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'issues' }}
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      profile: rust
      working-directory: fixtures/rust-basic

  # The lint-standard action on a repository without npm, the published tool at the version below.
  lint-standard:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'issues' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Copy of the standard without npm
        uses: ./.github/actions/lint-standard
        with:
          version: 0.2.7
          directory: fixtures/no-npm

  # The same fixture with one character of its copy changed: green only when the action fails with
  # the tool's "does not match".
  lint-standard-mismatch:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'issues' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Change one character of the copy
        run: |
          cp -R fixtures/no-npm "$RUNNER_TEMP/no-npm"
          sed -i '1s/^# Micelio/# Micelia/' "$RUNNER_TEMP/no-npm/docs/engineering-standard.md"
          head -n 1 "$RUNNER_TEMP/no-npm/docs/engineering-standard.md"

      - name: Copy of the standard without npm
        id: lint
        continue-on-error: true
        uses: ./.github/actions/lint-standard
        with:
          version: 0.2.7
          directory: ${{ runner.temp }}/no-npm

      - name: The action failed with does not match
        env:
          OUTCOME: ${{ steps.lint.outcome }}
          MESSAGE: ${{ steps.lint.outputs.message }}
        run: |
          echo "Outcome: $OUTCOME"
          echo "Line: $MESSAGE"
          [ "$OUTCOME" = failure ]
          case "$MESSAGE" in
            *'does not match'*) ;;
            *) echo "::error::the line does not say 'does not match'"; exit 1 ;;
          esac

  dco:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: ./.github/workflows/dco.yml

  scorecard:
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'issues' }}
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: ./.github/workflows/scorecard.yml

  # A dry run: prints the notes the fixture's fixed plan would publish and changes nothing.
  release:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'issues' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    # A called workflow cannot ask for more than its caller grants, also in a job that is skipped:
    # the publish job of release.yml asks for packages: write and id-token: write, so the call
    # grants them even though a dry run never reaches it.
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      dry-run: true
      version-script: fixtures/basic/scripts/version.mjs
      check-package-version: false
      sbom: false
      compatibility: |
        - Node: 22

  # Gate 1 on this repository's own issues. `issues` events run from the default branch, so the
  # workflow is tried here only after it is merged.
  issue-ready:
    if: ${{ github.event_name == 'issues' }}
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/issue-ready.yml
    with:
      tools-ref: ${{ github.sha }}
    secrets:
      MICELIO_BOT_PRIVATE_KEY: ${{ secrets.MICELIO_BOT_PRIVATE_KEY }}
