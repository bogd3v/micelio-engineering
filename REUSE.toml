version = 1
SPDX-PackageName = "Micelio engineering"
SPDX-PackageDownloadLocation = "https://github.com/bogd3v/micelio-engineering"

# The shared tooling, workflows and documents are MIT-0, like the packages (packages/*/LICENSE).
# Later annotations win over earlier ones.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Alejandro Ramirez Garcia and the Micelio contributors"
SPDX-License-Identifier = "MIT-0"

# template/ and template-rust/ are the source of other repositories' files, among them a REUSE.toml and a
# license text that say AGPL-3.0-only or another license. Here they are MIT-0 like everything else, so the
# closest-file rule must not let template/REUSE.toml or template-rust/REUSE.toml speak for this repository.
[[annotations]]
path = ["template/**", "template-rust/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Alejandro Ramirez Garcia and the Micelio contributors"
SPDX-License-Identifier = "MIT-0"


# The fonts of the factory mod are binary files under the SIL Open Font License 1.1, not MIT-0; their
# copyright is in each file's name table. These come after `path = "**"`, which would cover them.
[[annotations]]
path = "herdr/mod/**/fonts/ChakraPetch-*.ttf"
SPDX-FileCopyrightText = "2018 The Chakra Petch Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "herdr/mod/**/fonts/JetBrainsMono-*.ttf"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"
