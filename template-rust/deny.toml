# The licence allowlist of section 10 of the Rust profile, checked by `cargo deny check licenses`
# (the check command of AGENTS.md runs it). The policy is this repository's: edit the list to the
# licences it accepts for its dependencies, and write down why next to any one you add.
[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
]
confidence-threshold = 0.93
# A new repository has no dependencies yet, so most of the list is not encountered.
unused-allowed-license = "allow"

[licenses.private]
# This repository's own crate has the repository's license, which is not a dependency's.
ignore = true
