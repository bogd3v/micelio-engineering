name: DCO

# Every commit of a pull request carries the Signed-off-by of its author (section 11 of the
# standard). Call it from a workflow that runs on pull_request:
#
#   on:
#     pull_request:
#       branches: [main]
#   jobs:
#     dco:
#       uses: bogd3v/micelio-engineering/.github/workflows/dco.yml@<commit SHA> # <tag>

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by
    # The sign-off is a person's certification (section 13): the bots' pull requests are reviewed and
    # merged by a person instead.
    if: github.actor != 'dependabot[bot]' && github.actor != 'micelio-bot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "::error::The DCO check needs a pull_request event: call this workflow from one."
            exit 1
          fi
          failed=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$sha")
            author=$(git log -1 --format=%an "$sha")
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qixF "$author <$email>"; then
              echo "::error::Commit $sha lacks 'Signed-off-by: $author <$email>' (use git commit -s)"
              failed=1
            fi
          done
          exit $failed
