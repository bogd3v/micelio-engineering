name: Standard sync

# Carries the canonical standard to the other Micelio repositories (section 16 of the standard).
# It starts when a release of this repository marks a standard version with a line `Standard: X.Y`
# in its notes, or by hand. For each repository of .github/standard-sync.json it opens or updates a
# `docs(standard): sync to X.Y` pull request that replaces docs/engineering-standard.md and moves the
# pin in AGENTS.md, and raises @micelio/eslint-config in the same commit when the repository's lockfile
# installs an older version than the published one (the lockfile is made with the Node and npm of its .nvmrc),
# so nobody pushes to the bot's pull request. A human reviews and merges it: this workflow never
# merges anything.
#
# The pull requests are made by the Micelio bot (the organisation's GitHub App, client id in the
# variable MICELIO_BOT_CLIENT_ID and private key in the secret MICELIO_BOT_PRIVATE_KEY). The key is
# read only by the token step and never reaches a repository or a log.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Standard version to sync, X.Y; must be the one in docs/engineering-standard.md
        type: string
        required: true
      dry-run:
        description: List what would change without opening pull requests
        type: boolean
        default: true

permissions: {}

concurrency:
  group: standard-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read the version to sync
        id: version
        env:
          EVENT: ${{ github.event_name }}
          NOTES: ${{ github.event.release.body }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = release ]; then
            version=$(printf '%s\n' "$NOTES" | sed -n 's/^Standard: \([0-9][0-9]*\.[0-9][0-9]*\)[[:space:]]*$/\1/p' | head -n 1)
            if [ -z "$version" ]; then
              echo "The notes of $TAG mark no standard version (a line 'Standard: X.Y'): nothing to sync."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            version="$INPUT_VERSION"
            [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y, not '$version'"; exit 1; }
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "dry_run=$INPUT_DRY_RUN" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout the release
        if: ${{ steps.version.outputs.version != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.ref }}
          persist-credentials: false

      - name: Set up Node
        if: ${{ steps.version.outputs.version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the tooling
        if: ${{ steps.version.outputs.version != '' }}
        run: |
          npm ci
          npm run build

      # The copy being sent must be the version the release says, and the published one.
      - name: Check the canonical copy
        if: ${{ steps.version.outputs.version != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          actual=$(sed -n 's/^Version \([0-9][0-9]*\.[0-9][0-9]*\) .*/\1/p' docs/engineering-standard.md | head -n 1)
          [ "$actual" = "$VERSION" ] || { echo "::error::docs/engineering-standard.md is version '$actual', not $VERSION"; exit 1; }
          npm run lint:standard

      - name: Mint a token for Micelio bot
        if: ${{ steps.version.outputs.version != '' }}
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MICELIO_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MICELIO_BOT_PRIVATE_KEY }}
          owner: bogd3v
          repositories: |
            micelio
            micelio-cms
            micelio-plugin-core
          # A dry run only reads the repositories
          permission-contents: ${{ steps.version.outputs.dry_run == 'true' && 'read' || 'write' }}
          permission-pull-requests: ${{ steps.version.outputs.dry_run == 'true' && 'read' || 'write' }}

      - name: Open or update the pull requests
        if: ${{ steps.version.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ steps.version.outputs.dry_run }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          scripts/standard-sync.sh
